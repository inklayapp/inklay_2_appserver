<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inklay App Server</title>
<style>
 @font-face{font-family:"Roboto Mono";src:url(/fonts/RobotoMono-Regular.ttf) format("truetype");font-weight:400}
 @font-face{font-family:"Roboto Mono";src:url(/fonts/RobotoMono-Medium.ttf) format("truetype");font-weight:500}
 :root{--ink:#000;--paper:#fff;--field:#f3f3f3;--muted:#555}
 *{box-sizing:border-box}
 html,body{margin:0;background:var(--paper);color:var(--ink)}
 body{font:13px/1.5 "Roboto Mono",ui-monospace,monospace;padding:0 26px;max-width:1920px;margin:0 auto}
 header{position:relative;display:flex;justify-content:center;align-items:center;height:76px}
 header .logo{width:108px;height:auto;display:block}
 header .title{position:absolute;left:0;font-size:13px;margin:0;font-weight:400}
 header a{position:absolute;right:0;color:var(--ink);font-size:13px;text-underline-offset:3px}
 .label{font-size:11px;margin:0 0 8px}
 .url{display:flex;align-items:center;height:32px;background:var(--field)}
 .url input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:13px;padding:0 11px;color:var(--ink);border-radius:0;outline:none;text-overflow:ellipsis}
 .url button{flex:none;display:grid;place-items:center;width:40px;height:100%;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:0}
 .url button:hover{background:#e6e6e6}
 .url button svg{width:16px;height:16px}
 .url button .ok{display:none}
 .url button.done .ok{display:block}
 .url button.done .cp{display:none}
 section.setup{margin:28px 0 0}
 ol{margin:0;padding:0;list-style:none;font-size:11px;line-height:1.55}
 li{padding-left:3ch;text-indent:-3ch}
 .preview{margin:26px 0 0;background:var(--field)}
 .preview img{max-width:992px;margin:0 auto}
 .preview img{display:block;width:100%;height:auto;aspect-ratio:1872/1404;background:#000}
 footer{font-size:11px;padding:28px 0 40px}
 @media (max-width:600px){
  body{padding:0 16px}
  header{height:64px}
  header .logo{width:80px}
  header .title{font-size:11px}
  .url{height:44px}
  .url input{font-size:12px}
  .url button{width:44px}
  .url button svg{width:18px;height:18px}
  ol,footer{font-size:12px}
 }
</style></head><body>
<header>
 <h1 class="title">Inklay App Server</h1>
 {{.Logo}}
 <a href="https://inklay.gitbook.io/inklay-docs/image-url" target="_blank" rel="noopener">Help</a>
</header>
<main>
 <p class="label">Image URL</p>
 <div class="url"><input id="u" readonly value="{{.ImageURL}}" aria-label="Image URL"><button id="c" type="button" aria-label="Copy URL" title="Copy URL"><svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="8" y="8" width="13" height="13"/><path d="M16 8V3H3v13h5"/></svg><svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg></button></div>
 <div class="preview"><img id="p" src="/dashboard.png" alt="Dashboard preview"></div>
</main>
<footer>© 2026 Inklay GmbH</footer>
<script>
 const b=document.getElementById('c'),i=document.getElementById('u');
 b.onclick=async()=>{try{await navigator.clipboard.writeText(i.value)}catch(e){i.select();document.execCommand('copy')}b.classList.add('done');b.title='Copied';setTimeout(()=>{b.classList.remove('done');b.title='Copy URL'},1500)};
</script>
</body></html>
